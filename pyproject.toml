[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gt-osint-ai"
version = "0.0.1"
description = "Greater Türkiye OSINT AI: imagery red-line gate, open-catalogue scene search and work planning. Design stage; no model inference."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Keep runtime dependencies minimal (ADR 0011, supply chain): everything else is stdlib.
# No torch, no transformers, no rasterio here — nothing in this package runs a model yet, and
# adding a 2 GB dependency to a package that does not use it would be a lie in a file.
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
# Exact pins so lint/test results are reproducible in CI.
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[project.urls]
Homepage = "https://github.com/Greater-Turkiye/osint-ai"
Handbook = "https://github.com/Greater-Turkiye/handbook"

[project.scripts]
gt-osint-ai = "gt_osint_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gt_osint_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: hits a public API; deselected in CI with -m 'not network'",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
  "PLR0911", # many early returns are clearer in validators
  "PLR0912",
  "PLR0913",
  "PLR2004", # magic values are geodetic/sensor constants, named where it matters
  "RUF001",  # we deliberately handle Unicode (Turkish, Greek, Arabic…) text
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLC0415"]
